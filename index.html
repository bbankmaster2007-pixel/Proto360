<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame 360 Tour</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      /* Floor Menu Toggle Button UI */
      #menu-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 999;
        padding: 10px 18px;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        border: 2px solid #ffffff;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
      }
      #menu-btn:hover {
        background: #ffffff;
        color: #000000;
      }
    </style>
</head>
=-
<body>
    <!-- Toggle Menu UI Button -->
    <button id="menu-btn">Floors (M)</button>

    <a-scene execution-mode="async">
        <!--======================================================- Assets -===========================================================-->
        <a-assets>
            <!-- Arrow asset -->
             <img id="arrow" src="Buildingname/Name/arrow/arrowSignNow.jpg" crossorigin="anonymous">
            <!-- F1 -->
            <img id="locRA1" src="Buildingname/Name/Floor(1)/RA1.jpg" rotation="0 90 0" crossorigin="anonymous">
            <img id="locRA2" src="Buildingname/Name/Floor(1)/RA2.jpg" crossorigin="anonymous">
            <img id="locR1A2" src="Buildingname/Name/Floor(1)/R1A2.jpg" crossorigin="anonymous">
            <img id="locR2A2" src="Buildingname/Name/Floor(1)/R2A2.jpg" crossorigin="anonymous">
            <img id="locR3A2" src="Buildingname/Name/Floor(1)/R3A2.jpg" crossorigin="anonymous">
            <img id="locR4A2" src="Buildingname/Name/Floor(1)/R4A2.jpg" crossorigin="anonymous">
            <img id="locRA-1" src="Buildingname/Name/Floor(1)/RA-1.jpg" crossorigin="anonymous">
            <img id="locR1A-1" src="Buildingname/Name/Floor(1)/R1A-1.jpg" crossorigin="anonymous">
        </a-assets>

        <!--==================================================- Player controls -======================================================-->

        <!-- Camera Rig -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera id="camera"
                look-controls="touchEnabled: true; magicWindowControlsEnabled: true; wasd-controls-enabled: false;"
                wasd-controls="enabled: false" 
                cursor="rayOrigin: mouse" 
                raycaster="objects: .clickable">

                <!-- 3D Floor Selector Menu Container -->
                <a-entity id="floor-menu" position="0 0 -2.5" rotation="0 0 0" visible="false">
                    <!-- Dynamic floor boxes generated by JS -->
                </a-entity>

                <!-- Fade Overlay -->
               <a-sphere id="fade-overlay" radius="7" position="0 0 0"
                    material="color: #000000; side: double; transparent: true; opacity: 0"
                    animation__fadeout="property: material.opacity; from: 0; to: 1; dur: 400; startEvents: fade-out"
                    animation__fadein="property: material.opacity; from: 1; to: 0; dur: 400; startEvents: fade-in">
                </a-sphere>
            </a-camera>
        </a-entity>

        <a-sky id="sky" src="#loc1A1" rotation="0 0 0"></a-sky>

        <!-- Dynamic Teleport Container (Populated by JS) -->
        <a-entity id="TP" position="0 0 0"></a-entity>

        <a-entity id="blockArrow">
            <a-sphere class="clickable" rotation="0 0 0" radius="6" position="0 1 0" side="back"
                material="visible: false"></a-sphere>
        </a-entity>
    </a-scene>


    <script src="JS/array.js"></script>
    <script src="JS/main.js"></script>
</body>

</html>
